name: Deploy editor to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'Taskfile.yml'
      - 'example/web/**'
      - '!example/web/test/**'
      - '!example/web/tsconfig.json'
      - 'packages/browser/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/stratalith-wasm/**'
      - 'crates/stratalith-core/**'
      - 'crates/stratalith-markdown/**'
      - '!crates/**/tests/**'
      - '!crates/**/benches/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: rustup target add wasm32-unknown-unknown
      - uses: arduino/setup-task@v3
      - run: task web:build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/example

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
